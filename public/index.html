<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141917" />
    <script>
      // Apply the theme before rendering to avoid flashing the wrong background.
      (function () {
        var preference;
        try { preference = localStorage.getItem('blog-theme'); } catch (error) {}
        var theme = preference === 'light' || preference === 'dark'
          ? preference
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#141917' : '#f8f7f2';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#141917' : '#f8f7f2');
      })();
    </script>
    <meta name="description" content="PedroNauta: programação, investimentos, jogos e futebol." />
    <title>PedroNauta</title>
  </head>
  <body>
    <noscript>Ative o JavaScript para ler as publicações do blog.</noscript>
    <div id="root"></div>
  </body>
</html>
